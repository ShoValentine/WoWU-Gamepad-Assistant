<path d="M350 416H425L438 440H337Z" fill="#383a34"/><rect x="310" y="440" width="155" height="7" rx="3" fill="#8f794a"/>
<rect x="791" y="163" width="332" height="164" rx="14" fill="#111b21" stroke="#7e6b40" stroke-width="2"/><text x="817" y="202" fill="#edd294" font-size="23" font-weight="600">Gamepad Assistant</text><text x="817" y="235" fill="#c3cdd0" font-size="17">Display setup · game connection</text><text x="817" y="263" fill="#c3cdd0" font-size="17">Managed Sunshine streaming</text><circle cx="825" cy="295" r="5" fill="#9fbf8b"/><text x="840" y="301" fill="#a9bdab" font-size="15">Working behind the scenes</text>
