<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">WoWU companion setup</title><desc id="desc">World of Warcraft stays on the main gameplay screen. The Windows Assistant manages a separate WoWU interface streamed through Sunshine to a Moonlight touchscreen.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#11191d"/><stop offset="1" stop-color="#05090d"/></linearGradient><linearGradient id="gold" x2="1" y2="1"><stop stop-color="#efd38a"/><stop offset=".5" stop-color="#876426"/><stop offset="1" stop-color="#dbc17b"/></linearGradient><linearGradient id="world" x2="0" y2="1"><stop stop-color="#243c52"/><stop offset="1" stop-color="#10242b"/></linearGradient></defs>
<rect width="1200" height="600" rx="22" fill="url(#bg)"/><rect x="10" y="10" width="1180" height="580" rx="16" fill="none" stroke="url(#gold)" stroke-width="2"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="55" y="62" fill="#ebd08c" font-size="25" font-weight="600">ONE ADVENTURE. TWO SCREENS.</text><text x="55" y="91" fill="#b9c4ca" font-size="17">An overview of the companion setup</text>
<rect x="58" y="126" width="658" height="288" rx="12" fill="#080d11" stroke="url(#gold)" stroke-width="3"/><rect x="74" y="142" width="626" height="256" rx="3" fill="url(#world)"/>
