<rect x="210" y="461" width="473" height="91" rx="18" fill="#070c0f" stroke="url(#gold)" stroke-width="3"/><rect x="229" y="473" width="435" height="67" rx="7" fill="#17272b"/><text x="446" y="503" text-anchor="middle" fill="#f0d69a" font-size="23" font-weight="600">WoWU touchscreen interface</text><text x="446" y="526" text-anchor="middle" fill="#c0ccd0" font-size="15">Moonlight device · 1280 × 800</text>
<text x="794" y="458" fill="#d8c28b" font-size="21">Bags. Quests. Maps. More.</text><text x="794" y="489" fill="#b9c4ca" font-size="17">A companion interface within reach,</text><text x="794" y="515" fill="#b9c4ca" font-size="17">with the world on your main display.</text></g></svg>