name: Suggest an improvement
description: Suggest a feature or a better touchscreen/controller interaction.
title: "[Idea] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help you do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How would you like it to work?
      description: Include the WoW version, relevant module and a screenshot/reference if helpful.
    validations:
      required: true
